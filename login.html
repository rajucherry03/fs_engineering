<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Signup Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
      <link rel="icon" href="/assests/logo.png" type="image/x-icon" />

  <style>
    .slide-left {
      animation: slideLeft 0.5s ease forwards;
    }

    .slide-right {
      animation: slideRight 0.5s ease forwards;
    }

    @keyframes slideLeft {
      0% { transform: translateX(100%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideRight {
      0% { transform: translateX(-100%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    .fade-out {
      animation: fadeOut 0.3s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: scale(0.95); }
    }
  </style>
</head>
<body class="relative min-h-screen bg-gradient-to-br from-[#fdfbfb] to-[#ebedee] flex items-center justify-center font-sans overflow-hidden">

  <!-- Decorative Background Shapes -->
  <div class="absolute w-96 h-96 bg-purple-300 rounded-full top-[-100px] left-[-100px] opacity-20 blur-3xl"></div>
  <div class="absolute w-96 h-96 bg-indigo-300 rounded-full bottom-[-100px] right-[-100px] opacity-20 blur-3xl"></div>

  <!-- Auth Card -->
  <div class="bg-white rounded-xl shadow-2xl overflow-hidden w-full max-w-md transition-all duration-500 z-10">
    <div class="px-8 py-10" id="form-container">

      <!-- Logo (Shared) -->
      <div class="flex justify-center mb-6">
        <img src="/assests/logo.png" alt="Logo" class="h-20 w-20 object-contain rounded-full shadow" />
      </div>

      <!-- Login Form -->
      <div id="login-form">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Welcome Back</h2>
        <form>
          <input type="email" placeholder="Email" class="w-full mb-4 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          <input type="password" placeholder="Password" class="w-full mb-6 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          <button type="submit" class="w-full bg-indigo-500 text-white py-2 rounded hover:bg-indigo-600 transition duration-300">Login</button>
        </form>
        <p class="text-sm text-gray-600 mt-6 text-center">
          Don't have an account?
          <button onclick="toggleForm('signup')" class="text-indigo-500 hover:underline">Sign up</button>
        </p>
      </div>

      <!-- Signup Form -->
      <div id="signup-form" class="hidden">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Create Account</h2>
        <form>
          <input type="text" placeholder="Username" class="w-full mb-4 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-400" />
          <input type="email" placeholder="Email" class="w-full mb-4 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-400" />
          <input type="password" placeholder="Password" class="w-full mb-6 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-purple-400" />
          <button type="submit" class="w-full bg-purple-500 text-white py-2 rounded hover:bg-purple-600 transition duration-300">Sign up</button>
        </form>
        <p class="text-sm text-gray-600 mt-6 text-center">
          Already have an account?
          <button onclick="toggleForm('login')" class="text-purple-500 hover:underline">Login</button>
        </p>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');

    function toggleForm(type) {
      if (type === 'signup') {
        loginForm.classList.add('fade-out');
        setTimeout(() => {
          loginForm.classList.add('hidden');
          loginForm.classList.remove('fade-out');
          signupForm.classList.remove('hidden');
          signupForm.classList.add('slide-left');
          setTimeout(() => signupForm.classList.remove('slide-left'), 500);
        }, 300);
      } else {
        signupForm.classList.add('fade-out');
        setTimeout(() => {
          signupForm.classList.add('hidden');
          signupForm.classList.remove('fade-out');
          loginForm.classList.remove('hidden');
          loginForm.classList.add('slide-right');
          setTimeout(() => loginForm.classList.remove('slide-right'), 500);
        }, 300);
      }
    }
  </script>

</body>
</html>
