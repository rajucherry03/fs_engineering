<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Grid Collage</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black p-8">

  <div class="grid grid-cols-3 grid-rows-3 gap-4 h-screen">

    <!-- Large image left -->
    <div class="row-span-3 col-span-1">
      <img src="https://cdn.prod.website-files.com/646652fdea80d7aa0127ae04/6475c755c33e48ca85c28eea_pexels-tima-miroshniche-p-500.jpg" alt="Image 1" class="w-full h-full object-cover rounded" />
    </div>

    <!-- Top center image -->
    <div class="col-span-1">
      <img src="https://cdn.prod.website-files.com/646652fdea80d7aa0127ae04/6475b8dff7c1766d9717c63d_pexels-p-500.webp" alt="Image 2" class="w-full h-full object-cover rounded" />
    </div>

    <!-- Top right image -->
    <div class="col-span-1 row-span-2">
      <img src="https://cdn.prod.website-files.com/646652fdea80d7aa0127ae04/647858d2ed00ef7debf7ddef_pexels-tima-miroshnichenko-p-500.webp" alt="Image 3" class="w-full h-full object-cover rounded" />
    </div>

    <!-- Middle center image -->
    <div class="col-span-1">
      <img src="https://cdn.prod.website-files.com/646652fdea80d7aa0127ae04/647858d28bc1d570b291ba66_pexels-thisisengineering-p-500.webp" alt="Image 4" class="w-full h-full object-cover rounded" />
    </div>

    <!-- Bottom center image -->
    <div class="col-span-1">
      <img src="https://cdn.prod.website-files.com/646652fdea80d7aa0127ae04/647858d273a39840dd5cf02e_pexels-karolina-grabowska.webp" alt="Image 5" class="w-full h-full object-cover rounded" />
    </div>

    <!-- Bottom right image -->
    <div class="col-span-1">
      <img src="https://cdn.prod.website-files.com/646652fdea80d7aa0127ae04/6475b8df63db6e5b5f366c54_pexels-antoni-p-500.jpg" alt="Image 6" class="w-full h-full object-cover rounded" />
    </div>

  </div>

</body>
</html>
